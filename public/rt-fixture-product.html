<!--
  A fixture for the release suite, not a product.

  The catalogue importer is tested by pointing it at a page it can actually
  read. Pointing it at a real shop would make the suite depend on that shop
  being up, on it not blocking a datacentre address, and on its prices not
  changing overnight.

  It lives here rather than being copied in by the test run because the
  application reads its public directory once at boot, so a file dropped in
  afterwards is not served until the app is reloaded, and reloading production
  to run a test is the wrong trade. Nothing links to it and it is marked
  noindex.
-->
<h1>RT Fixture Blouse</h1>
